<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracko Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

body{
background:#eef3ff;
font-family:'Segoe UI',sans-serif;
transition:.4s;
}

.navbar-custom{
background:linear-gradient(135deg,#2563eb,#4f46e5);
color:white;
border-radius:20px;
padding:18px 25px;
box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.card-box{
border-radius:18px;
padding:18px;
color:white;
text-align:center;
box-shadow:0 8px 18px rgba(0,0,0,.12);
transition:.3s;
min-height:150px;
}

.card-box:hover{
transform:translateY(-6px);
}

.card-box i{
font-size:28px;
}

.number{
font-size:30px;
font-weight:bold;
margin-top:8px;
}

.title{
font-size:15px;
}

.bg1{background:linear-gradient(135deg,#2563eb,#3b82f6);}
.bg2{background:linear-gradient(135deg,#16a34a,#22c55e);}
.bg3{background:linear-gradient(135deg,#f59e0b,#fbbf24);}
.bg4{background:linear-gradient(135deg,#0ea5e9,#38bdf8);}
.bg5{background:linear-gradient(135deg,#ef4444,#f87171);}
.bg6{background:linear-gradient(135deg,#7c3aed,#a855f7);}

.section-card{
background:white;
border-radius:20px;
box-shadow:0 8px 18px rgba(0,0,0,.08);
margin-top:30px;
overflow:hidden;
transition:.4s;
}

.section-header{
background:#0d6efd;
color:white;
padding:14px;
font-weight:bold;
}

.action-btn{
border-radius:15px;
padding:18px;
font-weight:bold;
}

table thead{
background:#0d6efd;
color:white;
}

#themeBtn{
border:none;
border-radius:30px;
padding:10px 18px;
font-weight:bold;
}

/* DARK MODE */

body.dark{
background:#0f172a;
color:white;
}

body.dark .section-card{
background:#1e293b;
color:white;
}

body.dark table{
color:white;
}

body.dark tbody tr{
background:#1e293b;
}

body.dark .table-hover tbody tr:hover{
background:#334155;
}

body.dark .navbar-custom{
background:linear-gradient(135deg,#111827,#1e293b);
}

body.dark .btn-dark{
background:#475569;
border:none;
}

body.dark .btn-warning{
color:black;
}

body.dark .section-header{
background:#334155;
}

body.dark .table td,
body.dark .table th{
border-color:#475569;
}

</style>

</head>

<body>

<div class="container py-4">

<div class="navbar-custom d-flex justify-content-between align-items-center flex-wrap gap-2">

<div>
<h2 class="mb-0">
<i class="fa-solid fa-map-location-dot"></i>
Tracko Dashboard
</h2>
<small>Field Engineer Management System</small>
</div>

<div class="d-flex gap-2">

<button id="themeBtn" class="btn btn-light">
🌙 Dark Mode
</button>

<a href="/logout" class="btn btn-danger">
Logout
</a>

</div>

</div>

<!-- Statistics -->

<div class="row g-3 mt-3">

<div class="col-lg-2 col-md-4 col-6">
<div class="card-box bg1">
<i class="fa-solid fa-users"></i>
<div class="number" th:text="${totalEngineers}">0</div>
<div class="title">Engineers</div>
</div>
</div>

<div class="col-lg-2 col-md-4 col-6">
<div class="card-box bg2">
<i class="fa-solid fa-user-check"></i>
<div class="number" th:text="${activeEngineers}">0</div>
<div class="title">Active</div>
</div>
</div>

<div class="col-lg-2 col-md-4 col-6">
<div class="card-box bg3">
<i class="fa-solid fa-ticket"></i>
<div class="number" th:text="${totalRequests}">0</div>
<div class="title">Requests</div>
</div>
</div>

<div class="col-lg-2 col-md-4 col-6">
<div class="card-box bg2">
<i class="fa-solid fa-circle-check"></i>
<div class="number" th:text="${completedRequests}">0</div>
<div class="title">Completed</div>
</div>
</div>

<div class="col-lg-2 col-md-4 col-6">
<div class="card-box bg5">
<i class="fa-solid fa-clock"></i>
<div class="number" th:text="${pendingRequests}">0</div>
<div class="title">Pending</div>
</div>
</div>

<div class="col-lg-2 col-md-4 col-6">
<div class="card-box bg4">
<i class="fa-solid fa-screwdriver-wrench"></i>
<div class="number" th:text="${assignedRequests}">0</div>
<div class="title">Assigned</div>
</div>
</div>

</div>

<!-- Quick Actions -->

<div class="section-card">

<div class="section-header">
<i class="fa-solid fa-bolt"></i>
Quick Actions
</div>

<div class="card-body">

<div class="row g-3">

<div class="col-lg-4">
<a href="/engineers" class="btn btn-primary w-100 action-btn">
<i class="fa-solid fa-user-gear"></i><br>
Engineers
</a>
</div>

<div class="col-lg-4">
<a href="/requests" class="btn btn-success w-100 action-btn">
<i class="fa-solid fa-list-check"></i><br>
Service Requests
</a>
</div>

<div class="col-lg-4">
<a href="/customers" class="btn btn-warning w-100 action-btn">
<i class="fa-solid fa-address-book"></i><br>
Customers
</a>
</div>

</div>

</div>

</div>

<!-- Recent Requests -->

<div class="section-card">

<div class="section-header">
<i class="fa-solid fa-table"></i>
Recent Service Requests
</div>

<div class="table-responsive">

<table class="table table-hover mb-0">

<thead>

<tr>
<th>ID</th>
<th>Customer</th>
<th>Issue</th>
<th>Status</th>
</tr>

</thead>

<tbody>

<tr th:each="req:${recentRequests}">

<td th:text="${req.id}"></td>

<td th:text="${req.customerName}"></td>

<td th:text="${req.issue}"></td>

<td>

<span th:if="${req.status=='Completed'}"
class="badge bg-success">

Completed

</span>

<span th:if="${req.status=='Assigned'}"
class="badge bg-primary">

Assigned

</span>

<span th:if="${req.status=='Pending'}"
class="badge bg-warning text-dark">

Pending

</span>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

<script>

const themeBtn=document.getElementById("themeBtn");

if(localStorage.getItem("theme")==="dark"){
document.body.classList.add("dark");
themeBtn.innerHTML="☀️ Light Mode";
}

themeBtn.onclick=function(){

document.body.classList.toggle("dark");

if(document.body.classList.contains("dark")){

localStorage.setItem("theme","dark");
themeBtn.innerHTML="☀️ Light Mode";

}else{

localStorage.setItem("theme","light");
themeBtn.innerHTML="🌙 Dark Mode";

}

};

</script>

</body>
</html>
