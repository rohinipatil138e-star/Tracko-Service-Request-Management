<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineer Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

    <style>
        body{
            background:#eef3ff;
            font-family:'Segoe UI',sans-serif;
        }

        .profile-card{
            border:none;
            border-radius:25px;
            overflow:hidden;
            box-shadow:0 12px 30px rgba(0,0,0,.12);
            background:white;
        }

        .profile-header{
            background:linear-gradient(135deg,#2563eb,#4f46e5);
            color:white;
            padding:40px 20px;
            text-align:center;
        }

        .avatar{
            width:120px;
            height:120px;
            border-radius:50%;
            background:white;
            color:#2563eb;
            font-size:48px;
            font-weight:bold;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:auto;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
        }

        .info-card{
            border:none;
            border-radius:18px;
            box-shadow:0 5px 12px rgba(0,0,0,.08);
            transition:.3s;
        }

        .info-card:hover{
            transform:translateY(-4px);
        }

        .icon{
            font-size:28px;
        }

        #map{
            height:500px;
            border-radius:20px;
            overflow:hidden;
        }

        .btn-custom{
            border-radius:12px;
            padding:12px 24px;
            font-weight:600;
        }
    </style>
</head>

<body>

<div class="container py-4">

    <div class="profile-card">

        <!-- Header -->
        <div class="profile-header">

            <div class="avatar"
                 th:text="${#strings.substring(engineer.name,0,1)}">A</div>

            <h2 class="mt-3" th:text="${engineer.name}">Engineer Name</h2>

            <p class="mb-2" th:text="${engineer.department}">Department</p>

            <span class="badge bg-success"
                  th:text="${engineer.availability}">Available</span>

        </div>

        <div class="card-body p-4">

            <!-- Info Cards -->
            <div class="row g-3 mb-4">

                <div class="col-md-3">
                    <div class="info-card p-3 text-center">
                        <div class="icon">📧</div>
                        <h6 class="mt-2">Email</h6>
                        <small th:text="${engineer.email}"></small>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="info-card p-3 text-center">
                        <div class="icon">📱</div>
                        <h6 class="mt-2">Phone</h6>
                        <small th:text="${engineer.phone}"></small>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="info-card p-3 text-center">
                        <div class="icon">🛠️</div>
                        <h6 class="mt-2">Status</h6>
                        <small th:text="${engineer.status}"></small>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="info-card p-3 text-center">
                        <div class="icon">📍</div>
                        <h6 class="mt-2">Department</h6>
                        <small th:text="${engineer.department}"></small>
                    </div>
                </div>

            </div>

            <!-- Map -->
            <h4 class="mb-3">Live Engineer Location</h4>

            <div id="map"></div>

            <!-- Coordinates -->
            <div class="row mt-4">

                <div class="col-md-6">
                    <strong>Latitude:</strong>
                    <span th:text="${engineer.latitude}"></span>
                </div>

                <div class="col-md-6">
                    <strong>Longitude:</strong>
                    <span th:text="${engineer.longitude}"></span>
                </div>

            </div>

            <!-- Buttons -->
            <div class="mt-4 d-flex gap-3">

                <a th:href="'tel:'+${engineer.phone}"
                   class="btn btn-success btn-custom">
                    📞 Call Engineer
                </a>

                <a href="/engineers"
                   class="btn btn-dark btn-custom">
                    ⬅ Back
                </a>

            </div>

        </div>

    </div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script th:inline="javascript">

let lat = /*[[${engineer.latitude}]]*/ 15.8497;
let lng = /*[[${engineer.longitude}]]*/ 74.4977;
let name = /*[[${engineer.name}]]*/ "Engineer";

let map = L.map('map').setView([lat,lng],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'© OpenStreetMap'
}).addTo(map);

L.marker([lat,lng])
 .addTo(map)
 .bindPopup("<b>"+name+"</b><br>Current Location")
 .openPopup();

</script>

</body>
</html>
