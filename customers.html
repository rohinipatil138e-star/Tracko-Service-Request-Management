<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#eef3ff;
font-family:'Segoe UI',sans-serif;
}

.header{
background:linear-gradient(135deg,#2563eb,#4f46e5);
color:white;
padding:20px;
border-radius:20px;
margin-bottom:25px;
}

.card{
border:none;
border-radius:20px;
box-shadow:0 8px 20px rgba(0,0,0,.1);
}

.avatar{
width:70px;
height:70px;
border-radius:50%;
background:#2563eb;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
margin:auto;
}

.customer-card{
transition:.3s;
}

.customer-card:hover{
transform:translateY(-6px);
}

</style>

</head>

<body>

<div class="container py-4">

<div class="header d-flex justify-content-between align-items-center">

<h2>Customer Management</h2>

<a href="/" class="btn btn-light">Dashboard</a>

</div>

<div class="card p-4 mb-4">

<h4>Add Customer</h4>

<form action="/customers/save" method="post">

<div class="row g-3">

<div class="col-md-6">
<input type="text" name="name" class="form-control" placeholder="Customer Name" required>
</div>

<div class="col-md-6">
<input type="text" name="phone" class="form-control" placeholder="Phone Number" required>
</div>

<div class="col-md-6">
<input type="email" name="email" class="form-control" placeholder="Email" required>
</div>

<div class="col-md-6">
<input type="text" name="address" class="form-control" placeholder="Address" required>
</div>

<div class="col-12">
<button class="btn btn-primary">Save Customer</button>
</div>

</div>

</form>

</div>

<form action="/customers" method="get" class="mb-4">

<div class="input-group">

<input type="text" name="search" class="form-control" placeholder="Search customer">

<button class="btn btn-primary">Search</button>

</div>

</form>

<div class="row g-4">

<div class="col-md-4"
th:each="customer:${customers}">

<div class="card customer-card h-100">

<div class="card-body text-center">

<div class="avatar"
th:text="${#strings.substring(customer.name,0,1)}">
A
</div>

<h4 class="mt-3"
th:text="${customer.name}">
</h4>

<p>📱 <span th:text="${customer.phone}"></span></p>

<p>📧 <span th:text="${customer.email}"></span></p>

<p>📍 <span th:text="${customer.address}"></span></p>

<a href="/requests"
class="btn btn-success w-100">

Create Service Request

</a>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
