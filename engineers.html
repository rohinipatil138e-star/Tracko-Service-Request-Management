<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Engineers</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#eef3ff;
}

.card{
border:none;
border-radius:18px;
box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.table th{
background:#0d6efd;
color:white;
}

</style>

</head>

<body>

<div class="container mt-4">

<div class="d-flex justify-content-between mb-4">

<h2>Engineers</h2>

<a href="/" class="btn btn-dark">
Dashboard
</a>

</div>

<div class="card">

<div class="card-body table-responsive">

<table class="table table-hover">

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Department</th>
<th>Status</th>
<th>Availability</th>
<th>Profile</th>

</tr>

</thead>

<tbody>

<tr th:each="engineer:${engineers}">

<td th:text="${engineer.id}"></td>

<td th:text="${engineer.name}"></td>

<td th:text="${engineer.department}"></td>

<td>

<span class="badge bg-success"
th:text="${engineer.status}">
</span>

</td>

<td>

<span th:if="${engineer.availability=='Available'}"
class="badge bg-success">

Available

</span>

<span th:if="${engineer.availability=='Busy'}"
class="badge bg-danger">

Busy

</span>

</td>

<td>

<a th:href="@{'/engineer/'+${engineer.id}}"
class="btn btn-primary btn-sm">

View Map

</a>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</body>

</html>
