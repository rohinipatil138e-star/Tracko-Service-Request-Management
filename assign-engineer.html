<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Engineer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }
        .card{
            margin:40px auto;
            max-width:700px;
            border:none;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,0.15);
        }
        .card-header{
            background:#0d6efd;
            color:white;
            font-size:32px;
            font-weight:bold;
            padding:20px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card">

        <div class="card-header">
            Assign Engineer
        </div>

        <div class="card-body">

            <p class="fs-5">
                <strong>Customer:</strong>
                <span th:text="${request.customerName}"></span>
            </p>

            <p class="fs-5">
                <strong>Issue:</strong>
                <span th:text="${request.issue}"></span>
            </p>

            <form th:action="@{'/assign/' + ${request.id}}" method="post">

                <div class="mb-4">
                    <label class="form-label fs-5">Select Engineer</label>

                    <select class="form-select form-select-lg"
                            name="engineerId"
                            required>

                        <option value="">Choose Engineer</option>

                        <option
                                th:each="eng : ${engineers}"
                                th:value="${eng.id}"
                                th:text="${eng.name + ' - ' + eng.department}">
                        </option>

                    </select>
                </div>

                <button type="submit" class="btn btn-success btn-lg">
                    Assign Engineer
                </button>

                <a href="/requests" class="btn btn-dark btn-lg">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
